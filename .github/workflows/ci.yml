name: CI/CD - Spring Boot Build & Docker Hub Deploy

on:
  push:
    branches:
      - main
      - homologation
      - production
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/challengeone

# ----------------------------------------------------
# 1️⃣ BUILD & TEST
# ----------------------------------------------------
jobs:
  build-and-test:
    name: Build and Test Project
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and Test with Maven
        run: mvn -B clean package

  # ----------------------------------------------------
  # 2️⃣ BUILD & PUSH IMAGE (Docker Hub)
  # ----------------------------------------------------
  push-image:
    name: Build & Push Docker Image
    runs-on: self-hosted
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment tag
        id: envtag
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "TAG=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ env.TAG }} .
          docker push $IMAGE_NAME:${{ env.TAG }}

          # opcional: manter latest sempre atualizado
          docker tag $IMAGE_NAME:${{ env.TAG }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
# ----------------------------------------------------




